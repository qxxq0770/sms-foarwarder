[project]
name = "sms-forwarder-web"
version = "0.1.0"
description = "A private, self-hosted SMS webhook inbox"
requires-python = ">=3.12"
dependencies = [
  "cryptography==50.0.0",
  "fastapi @ https://files.pythonhosted.org/packages/cb/03/10388a42375ee7e4ac9b94eb2c5c569c8b5795e377e701c9ac3ad63de890/fastapi-0.141.1-py3-none-any.whl#sha256=bfb91aa2d334c61cb35ba9a116fc123b3d3df31640b801cf57a7a78ec3f603b3",
  "pydantic-settings==2.10.1",
  "starlette @ https://files.pythonhosted.org/packages/e6/6a/a9ff0b4b7603f9498fa419b63ff09e182536ff2f739c85df7f38c0b46781/starlette-1.5.0-py3-none-any.whl#sha256=9ca76b47375e56f279d7c66651e801ef11167e58557c429be7ec55702d81d4bb",
  "uvicorn[standard]==0.39.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.setuptools.package-data]
app = ["static/*"]
